<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bounty Show · Overlay</title>
<script src="/socket.io/socket.io.js"></script>
<style>
/* OBS browser source: 1920x1080, transparent background.
   Add ?side=left|right to move the card, ?scale=0.8 to resize. */
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Crimson Text',Georgia,serif; }

#root {
  position:absolute; top:60px; right:60px;
  width:520px;
  transform-origin: top right;
}
body.side-left #root { left:60px; right:auto; transform-origin: top left; }

/* ── ACTIVE BOUNTY CARD ──────────────────────────────────── */
.card {
  position:relative;
  border-radius:16px;
  padding:20px 22px 18px;
  border:1px solid rgba(92,61,28,0.35);
  background-color:#e9ddb7;
  background-image:
    radial-gradient(circle at 18% 20%, rgba(255,255,255,0.34), transparent 24%),
    radial-gradient(circle at 82% 26%, rgba(120,83,37,0.10), transparent 20%),
    radial-gradient(circle at 28% 78%, rgba(255,255,255,0.18), transparent 22%),
    linear-gradient(180deg, rgba(255,248,222,0.92), rgba(223,204,156,0.94));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -10px 20px rgba(120,83,37,0.06), 0 12px 34px rgba(0,0,0,0.45);
  color:#8C3500;
  opacity:0; transform:translateY(-18px) scale(0.97);
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2,0.9,0.3,1.2);
}
.card.visible { opacity:1; transform:translateY(0) scale(1); }

.card-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:2px solid rgba(140,53,0,0.28); padding-bottom:9px; margin-bottom:11px; }
.who { font-family:'WildBreathZelda','Cinzel',serif; font-size:2.1rem; line-height:1; letter-spacing:0.02em; }
.value { font-family:'WildBreathZelda','Cinzel',serif; font-size:2.5rem; line-height:1; color:#7a4a00; white-space:nowrap; }
.eyebrow { font-family:'Cinzel',serif; font-size:0.66rem; letter-spacing:0.24em; text-transform:uppercase; opacity:0.72; margin-bottom:3px; }
.bounty-title { font-family:'WildBreathZelda','Cinzel',serif; font-size:1.85rem; line-height:1.2; margin-bottom:7px; }
.bounty-desc { font-size:1.06rem; line-height:1.42; color:#8C3500; opacity:0.92; }
.level-pip { position:absolute; top:-10px; left:22px; background:#8C3500; color:#f5e6c8; font-family:'Cinzel',serif; font-size:0.66rem; letter-spacing:0.14em; padding:3px 11px; border-radius:3px; text-transform:uppercase; box-shadow:0 3px 10px rgba(0,0,0,0.35); }

/* ── PERSISTENT FAILED STAMP (stays until the game ends) ──
   Sits below the text rather than across it, so the bounty stays
   readable for the whole game it's stamped. */
.stamp {
  position:absolute; right:18px; bottom:14px;
  transform:rotate(-7deg) scale(0.86);
  transform-origin:100% 100%;
  border:4px solid #b81c1c; color:#b81c1c;
  font-family:'Cinzel',serif; font-weight:900; font-size:1.7rem; letter-spacing:0.12em;
  padding:5px 20px; border-radius:7px;
  background:rgba(255,235,235,0.35);
  text-shadow:0 2px 4px rgba(0,0,0,0.15);
  opacity:0; pointer-events:none;
  transition:opacity 0.4s ease, transform 0.4s cubic-bezier(0.2,1.5,0.4,1);
}
.card.is-failed .stamp { opacity:0.95; transform:rotate(-7deg) scale(1); }
.card.is-failed { padding-bottom:64px; filter:saturate(0.8); }

/* ── ANIMATION LAYER ─────────────────────────────────────── */
#fx { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.banner {
  position:relative;
  padding:34px 78px;
  font-family:'Cinzel',serif; font-weight:900; letter-spacing:0.16em; text-transform:uppercase;
  font-size:5.2rem; line-height:1;
  white-space:nowrap;
  opacity:0;
}
.banner .sub {
  display:block; text-align:center; font-family:'Crimson Text',serif; font-weight:400;
  font-size:1.5rem; letter-spacing:0.14em; margin-top:14px; text-transform:none;
}

/* CLAIMED — gold slam + shine sweep */
.banner.claimed {
  color:#ffe9a8;
  background:linear-gradient(180deg, rgba(60,44,8,0.94), rgba(28,20,4,0.94));
  border:3px solid #c9a84c;
  box-shadow:0 0 70px rgba(201,168,76,0.65), inset 0 0 40px rgba(201,168,76,0.22);
  text-shadow:0 0 26px rgba(255,214,120,0.85), 0 4px 0 rgba(0,0,0,0.4);
  animation:slamIn 0.5s cubic-bezier(0.2,1.4,0.4,1) forwards, holdOut 1.1s 2.6s ease forwards;
}
.banner.claimed::after {
  content:''; position:absolute; inset:0; overflow:hidden;
  background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.55) 50%, transparent 62%);
  background-size:260% 100%;
  animation:shine 1.15s 0.35s ease-out;
}
/* FAILED — red stamp slam + shake */
.banner.failed {
  color:#ffcaca;
  background:linear-gradient(180deg, rgba(74,10,10,0.95), rgba(32,4,4,0.95));
  border:3px solid #b81c1c;
  box-shadow:0 0 60px rgba(184,28,28,0.6), inset 0 0 40px rgba(184,28,28,0.25);
  text-shadow:0 0 22px rgba(255,90,90,0.7), 0 4px 0 rgba(0,0,0,0.45);
  animation:stampIn 0.42s cubic-bezier(0.3,1.6,0.4,1) forwards, shake 0.42s 0.42s ease-in-out, holdOut 0.9s 2.2s ease forwards;
}
/* GAME OVER — the dollar bump */
.banner.raised {
  color:#e8c97a;
  background:linear-gradient(180deg, rgba(30,26,14,0.93), rgba(16,14,8,0.93));
  border:2px solid #8a6a1f;
  font-size:3.4rem;
  box-shadow:0 0 40px rgba(201,168,76,0.35);
  animation:riseIn 0.5s ease forwards, holdOut 0.8s 2.1s ease forwards;
}
.banner.raised .old { text-decoration:line-through; opacity:0.5; margin-right:18px; }

@keyframes slamIn {
  0%   { opacity:0; transform:scale(2.6) rotate(-6deg); filter:blur(6px); }
  60%  { opacity:1; transform:scale(0.94) rotate(0deg); filter:blur(0); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes stampIn {
  0%   { opacity:0; transform:scale(3) rotate(-18deg); filter:blur(7px); }
  70%  { opacity:1; transform:scale(0.92) rotate(-3deg); filter:blur(0); }
  100% { opacity:1; transform:scale(1) rotate(-3deg); }
}
@keyframes shake {
  0%,100% { margin-left:0; }
  20% { margin-left:-16px; } 40% { margin-left:14px; }
  60% { margin-left:-9px; }  80% { margin-left:6px; }
}
@keyframes riseIn {
  0%   { opacity:0; transform:translateY(40px); }
  100% { opacity:1; transform:translateY(0); }
}
@keyframes holdOut {
  0%   { opacity:1; }
  100% { opacity:0; transform:scale(1.06); }
}
@keyframes shine {
  0%   { background-position:180% 0; }
  100% { background-position:-80% 0; }
}

/* Confetti-ish gold sparks on a claim */
.spark { position:absolute; width:9px; height:9px; background:#ffd76a; border-radius:2px; opacity:0; }
</style>
</head>
<body>

<div id="root">
  <div class="card" id="card">
    <div class="level-pip" id="pip">Level I</div>
    <div class="card-head">
      <div>
        <div class="eyebrow">Bounty Hunter</div>
        <div class="who" id="who">—</div>
      </div>
      <div style="text-align:right;">
        <div class="eyebrow">Worth</div>
        <div class="value" id="value">$10</div>
      </div>
    </div>
    <div class="bounty-title" id="title">—</div>
    <div class="bounty-desc" id="desc"></div>
    <div class="stamp">Bounty Failed</div>
  </div>
</div>

<div id="fx"></div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('side') === 'left') document.body.classList.add('side-left');
const scale = parseFloat(params.get('scale'));
if (Number.isFinite(scale) && scale > 0) document.getElementById('root').style.transform = `scale(${scale})`;

// Match the stream's existing overlay typeface when it's available.
(async function loadFont() {
  try {
    const font = new FontFace('WildBreathZelda', 'url("/The Wild Breath of Zelda.otf") format("opentype")');
    await font.load();
    document.fonts.add(font);
  } catch (e) { /* falls back to Cinzel */ }
})();

const socket = io();
const el = id => document.getElementById(id);
const money = n => '$' + Number(n || 0).toLocaleString();
const LEVELS = { 1: 'Level I', 2: 'Level II', 3: 'Level III' };

// Events carry an id so a browser-source refresh doesn't replay the last
// animation. Anything seen before this page loaded is treated as seen.
let seenEvent = null;
let primed = false;

socket.on('show:state', s => {
  if (!primed) { seenEvent = s.event?.id || null; primed = true; }
  renderCard(s);
});

socket.on('show:event', ev => {
  if (!primed || !ev || ev.id === seenEvent) return;
  seenEvent = ev.id;
  playEvent(ev);
});

function renderCard(s) {
  const card = el('card');
  const a = s.active;
  if (!a || !a.bounty) {
    card.classList.remove('visible', 'is-failed');
    return;
  }
  el('who').textContent = a.player;
  el('value').textContent = money(a.bounty.value);
  el('title').textContent = a.bounty.title;
  el('desc').textContent = a.bounty.description;
  el('pip').textContent = LEVELS[a.bounty.level] || 'Bounty';
  card.classList.add('visible');
  card.classList.toggle('is-failed', !!a.bountyFailed);
}

function playEvent(ev) {
  if (ev.kind === 'claimed') {
    banner('claimed', 'Bounty Claimed', `${ev.player} · ${money(ev.value)}`, 3700);
    sparks();
  } else if (ev.kind === 'failed') {
    banner('failed', 'Bounty Failed', ev.bounty?.title || '', 3100);
  } else if (ev.kind === 'ended' && ev.newValue != null) {
    banner('raised',
      `<span class="old">${money(ev.oldValue)}</span>${money(ev.newValue)}`,
      `${ev.bounty?.title || 'Bounty'} — back on the board`, 2900);
  }
}

function banner(kind, text, sub, life) {
  const fx = el('fx');
  const div = document.createElement('div');
  div.className = 'banner ' + kind;
  div.innerHTML = `${text}${sub ? `<span class="sub">${sub}</span>` : ''}`;
  fx.appendChild(div);
  setTimeout(() => div.remove(), life);
}

function sparks() {
  const fx = el('fx');
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const dist = 220 + Math.random() * 520;
    s.style.left = '50%';
    s.style.top = '50%';
    s.style.background = Math.random() > 0.5 ? '#ffd76a' : '#fff3c4';
    fx.appendChild(s);
    s.animate([
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)' },
      { opacity: 0, transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px)) scale(0.3) rotate(${Math.random() * 720}deg)` },
    ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(0.15,0.8,0.3,1)' });
    setTimeout(() => s.remove(), 1900);
  }
}
</script>
</body>
</html>
